name: NexusDesk v1.0 release checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-not-for-production-strong-test-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check
      - name: Prepare static assets
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python manage.py test --verbosity 2
      - name: Validate production-like synthetic demo configuration
        env:
          DJANGO_DEBUG: "false"
          NEXUSDESK_DEMO_MODE: "true"
          DJANGO_SECRET_KEY: "ci-only-synthetic-demo-release-gate-not-for-production"
          DJANGO_ALLOWED_HOSTS: "nexusdesk.example.invalid"
          DJANGO_ENABLE_HSTS: "true"
          DJANGO_SECURE_SSL_REDIRECT: "true"
        run: |
          python scripts/check_release_config.py
          python manage.py check --deploy
